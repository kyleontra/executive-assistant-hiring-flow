<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pay | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./post-steps.css" />
    <link rel="stylesheet" href="./employer-nav.css" />
  </head>
  <body class="simple-employer-page employer-only">
    <header class="simple-header">
      <a class="simple-brand site-logo-link" href="./index.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a href="./talent.html">Talent</a><a href="./inbox.html">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>

    <main class="post-step-shell">
      <nav class="post-step-progress" aria-label="Job posting progress">
        <span class="done"><b>✓</b> Job basics</span><i></i>
        <span class="active"><b>2</b> Pay</span><i></i>
        <span><b>3</b> Description</span><i></i>
        <span><b>4</b> Review</span><i></i>
        <span><b>5</b> Promote</span>
      </nav>

      <form id="compensationForm" class="post-step-card" novalidate>
        <h1>Add pay</h1>
        <p class="post-step-intro">Set the pay range for this role in US dollars.</p>

        <p class="post-field-label">Pay range <em>*</em></p>
        <div class="post-pay-row">
          <span class="post-money"><b aria-hidden="true">$</b><input id="minRate" name="minRate" type="number" inputmode="numeric" min="4" step="1" pattern="[0-9]*" placeholder="From" aria-label="Pay from" required /></span>
          <span class="post-pay-to" aria-hidden="true">to</span>
          <span class="post-money"><b aria-hidden="true">$</b><input id="maxRate" name="maxRate" type="number" inputmode="numeric" min="4" step="1" pattern="[0-9]*" placeholder="To" aria-label="Pay to" required /></span>
          <select id="payPeriod" name="payPeriod" aria-label="Pay rate" required>
            <option value="hour" selected>per hour</option>
            <option value="month">per month</option>
          </select>
        </div>
        <p id="payLimits" class="post-pay-limits">Hourly pay: the minimum hourly we recommend is $4 per hour.</p>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="post-step-footer">
          <a class="post-back" href="./index.html"><span aria-hidden="true">←</span> Back</a>
          <button class="post-continue" type="submit">Continue <span aria-hidden="true">→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./employer-auth.js"></script>
    <script src="./script.js"></script>
    <script src="./account-role.js"></script>
    <script src="./employer-nav.js"></script>
  </body>
</html>
