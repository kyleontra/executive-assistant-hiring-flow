<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Commitment and Pay | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
    <link rel="stylesheet" href="./brand.css" />
  </head>
  <body class="simple-employer-page employer-only">
    <header class="simple-header">
      <a class="simple-brand site-logo-link" href="./index.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a href="./applicants.html">Hiring inbox</a><a href="./applicants.html?view=messages">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>

    <main class="job-flow-shell compact-flow-shell">
      <nav class="flow-progress five-step-progress" aria-label="Job posting progress">
        <span class="done"><b>✓</b> Title</span><i></i>
        <span class="done"><b>✓</b> Role details</span><i></i>
        <span class="active"><b>3</b> Pay</span><i></i>
        <span><b>4</b> Review</span>
      </nav>

      <form id="compensationForm" class="job-flow-card" novalidate>
        <header class="flow-card-heading">
          <p class="simple-kicker">POST A JOB</p>
          <h1>Commitment &amp; pay</h1>
        </header>

        <fieldset class="commitment-options commitment-page-options">
          <legend>Commitment <em>*</em></legend>
          <label><input type="radio" name="commitment" value="Full-time (40 hours per week)" required /><span><b>Full-time</b><small>40 hours per week</small></span></label>
          <label><input type="radio" name="commitment" value="Part-time (20 to 40 hours per week)" required /><span><b>Part-time</b><small>20 to 40 hours per week</small></span></label>
          <label><input type="radio" name="commitment" value="Less than 20 hours per week" required /><span><b>Less than 20 hours</b><small>Per week</small></span></label>
        </fieldset>

        <section class="pay-section">
          <div><h2>Hourly rate</h2></div>
          <div class="rate-row">
            <label class="simple-field">From <em>*</em><div class="rate-input"><span>$</span><input id="minRate" name="minRate" type="number" min="3" step="0.25" inputmode="decimal" required /><small>USD / hour</small></div></label>
            <label class="simple-field">To <em>*</em><div class="rate-input"><span>$</span><input id="maxRate" name="maxRate" type="number" min="3.25" step="0.25" inputmode="decimal" required /><small>USD / hour</small></div></label>
          </div>
        </section>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="flow-card-footer">
          <a href="./job-description.html">← Back</a>
          <button class="primary-button" type="submit">Continue <span>→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./script.js"></script>
    <script src="./account-role.js"></script>
  </body>
</html>
