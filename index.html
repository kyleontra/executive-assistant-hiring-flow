<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Post a Job | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./post-flow.css" />
    <link rel="stylesheet" href="./post-steps.css" />
    <link rel="stylesheet" href="./employer-nav.css" />
  </head>
  <body class="simple-employer-page employer-only">
    <header class="simple-header">
      <a class="simple-brand site-logo-link" href="./index.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a href="./talent.html">Talent</a><a href="./inbox.html">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>

    <main class="post-step-shell">
      <nav class="post-step-progress" aria-label="Job posting progress" hidden>
        <span class="active"><b>1</b> Job basics</span><i></i>
        <span><b>2</b> Pay</span><i></i>
        <span><b>3</b> Description</span><i></i>
        <span><b>4</b> Review</span><i></i>
        <span><b>5</b> Promote</span>
      </nav>

      <section id="contactJobBanner" class="post-contact-banner" hidden>
        <h2 id="contactJobTitle"></h2>
        <p id="contactJobText"></p>
      </section>

      <section id="postModeChoice" class="post-step-card post-mode" hidden>
        <h1>How would you like to write your job post?</h1>
        <div class="post-mode-options">
          <button type="button" class="post-mode-option ai" data-mode="ai">
            <span class="post-mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span>
            <b>Write it with AI</b>
            <small>Type or talk about the job and our AI writes the post for you.</small>
          </button>
          <button type="button" class="post-mode-option" data-mode="manual">
            <span class="post-mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></span>
            <b>Type it in myself</b>
            <small>Fill in each part of the post on your own.</small>
          </button>
        </div>
      </section>

      <form id="postJobForm" class="post-step-card" data-step="title" novalidate hidden>
        <h1>Add job basics</h1>

        <label class="post-field"><span>Job title <em>*</em></span><input id="title" name="title" maxlength="100" placeholder="e.g. Executive Assistant" autocomplete="off" required /></label>

        <fieldset class="post-field post-choice-group">
          <legend>Employment type <em>*</em></legend>
          <div class="post-choices">
            <label><input type="radio" name="employmentType" value="Full-time" required /><span><b>Full-time</b><small>40 hours a week</small></span></label>
            <label><input type="radio" name="employmentType" value="Part-time" required /><span><b>Part-time</b><small>20+ hours a week</small></span></label>
            <label><input type="radio" name="employmentType" value="Contract" required /><span><b>Contract</b><small>Per project, no hourly</small></span></label>
          </div>
        </fieldset>

        <label class="post-field"><span>Hiring timeline <em>*</em></span>
          <select id="hiringTimeline" name="hiringTimeline" required>
            <option value="" disabled selected>How soon do you need to hire?</option>
            <option>ASAP</option>
            <option>Within 2 weeks</option>
            <option>More than 2 weeks</option>
          </select>
        </label>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="post-step-footer">
          <button class="post-continue" type="submit">Continue <span aria-hidden="true">→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./employer-auth.js"></script>
    <script src="./script.js"></script>
    <script src="./account-role.js"></script>
    <script src="./employer-nav.js"></script>
  </body>
</html>
