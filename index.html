<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Post a Job | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
  </head>
  <body class="simple-employer-page employer-only">
    <header class="simple-header">
      <a class="simple-brand" href="./index.html">HIRE FROM <span>SA</span></a>
      <nav><a href="./applicants.html">Hiring inbox</a><a href="./applicants.html?view=messages">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>

    <main class="job-flow-shell single-step-shell title-step-shell">
      <nav class="flow-progress five-step-progress" aria-label="Job posting progress">
        <span class="active"><b>1</b> Title</span><i></i>
        <span><b>2</b> Role details</span><i></i>
        <span><b>3</b> Pay</span><i></i>
        <span><b>4</b> Review</span>
      </nav>

      <form id="postJobForm" class="job-flow-card" data-step="title" novalidate>
        <header class="flow-card-heading">
          <p class="simple-kicker">POST A JOB</p>
          <h1>Job title <em>*</em></h1>
        </header>

        <section class="wide-fields">
          <label class="simple-field"><span>Company name <em>*</em></span><input id="companyName" name="companyName" maxlength="120" placeholder="Enter company name" required /></label>
          <div class="job-title-editor">
            <label class="simple-field"><span class="visually-hidden">Job title</span><input id="title" name="title" maxlength="100" placeholder="Enter job title" required /></label>
          </div>
        </section>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="flow-card-footer">
          <span></span>
          <button class="primary-button" type="submit">Continue <span>→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./script.js"></script>
    <script src="./account-role.js"></script>
  </body>
</html>
