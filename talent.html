<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f9" />
    <title>Search Talent | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./talent.css" />
    <link rel="stylesheet" href="./employer-nav.css" />
  </head>
  <body class="simple-employer-page talent-page">
    <header class="simple-header">
      <a class="simple-brand site-logo-link" href="./home.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav>
        <a class="active" href="./talent.html">Search talent</a>
        <a href="./admin-resumes.html" data-master-resume hidden>Resume database</a>
        <a href="./inbox.html">Messages</a>
        <a href="./posted-jobs.html">Posted jobs</a>
        <a href="./index.html">Post a job</a>
      </nav>
    </header>

    <main class="st-shell">
      <h1>Describe your ideal candidate.</h1>

      <form id="stForm" class="st-search" role="search">
        <span class="st-ai" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/></svg></span>
        <label class="st-hidden" for="stQuery">Search talent</label>
        <input id="stQuery" type="search" autocomplete="off" placeholder="Try &quot;paralegal&quot;, &quot;Excel&quot;, or describe who you need" />
        <button type="submit">Search with AI</button>
      </form>

      <div class="st-examples" aria-label="Example searches">
        <button type="button" data-example="Paralegal">Paralegal</button>
        <button type="button" data-example="Excel">Excel</button>
        <button type="button" data-example="Someone who can do bookkeeping in QuickBooks and work US hours">Bookkeeping in QuickBooks, US hours</button>
        <button type="button" data-example="Video editor with 3+ years who has edited weddings">Video editor, 3+ years, weddings</button>
        <button type="button" data-example="Executive assistant who has worked directly with a CEO">Worked directly with a CEO</button>
      </div>

      <p id="stUnderstood" class="st-understood" hidden></p>

      <div class="st-results-head">
        <div><h2 id="stTitle">All candidates</h2><p id="stSummary">Loading candidates…</p></div>
        <div class="st-head-actions">
          <button id="stClear" class="st-clear" type="button" hidden>Clear search</button>
          <label><span>Organize by</span>
            <select id="stSort"><option value="match">Best match</option><option value="years">Most experience</option><option value="az">A to Z</option></select>
          </label>
        </div>
      </div>

      <p id="stStatus" class="st-status" role="status" hidden></p>
      <section id="stResults" class="st-results" aria-live="polite"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./employer-auth.js"></script>
    <script src="./platform-client.js"></script>
    <script src="./talent.js"></script>
    <script src="./employer-nav.js"></script>
  </body>
</html>
