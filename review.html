<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Review Your Job | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./post-steps.css" />
    <link rel="stylesheet" href="./employer-nav.css" />
  </head>
  <body class="simple-employer-page employer-only">
    <header class="simple-header">
      <a class="simple-brand site-logo-link" href="./index.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a href="./talent.html">Talent</a><a href="./inbox.html">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>
    <main class="post-step-shell">
      <nav class="post-step-progress" aria-label="Job posting progress">
        <span class="done"><b>✓</b> Job basics</span><i></i>
        <span class="done"><b>✓</b> Pay</span><i></i>
        <span class="done"><b>✓</b> Description</span><i></i>
        <span class="active"><b>4</b> Review</span><i></i>
        <span><b>5</b> Promote</span>
      </nav>

      <form id="reviewStepForm" class="post-step-card" novalidate>
        <h1>Review your job</h1>

        <dl class="post-review-list">
          <div><dt>Job title</dt><dd data-review-field="title"></dd><a href="./index.html" aria-label="Edit job title">Edit</a></div>
          <div><dt>Employment type</dt><dd data-review-field="employmentType"></dd><a href="./index.html" aria-label="Edit employment type">Edit</a></div>
          <div><dt>Hiring timeline</dt><dd data-review-field="hiringTimeline"></dd><a href="./index.html" aria-label="Edit hiring timeline">Edit</a></div>
          <div><dt>Pay</dt><dd data-review-field="pay"></dd><a href="./compensation.html" aria-label="Edit pay">Edit</a></div>
        </dl>

        <section class="post-screening">
          <h2>Screening questions <span>(optional)</span></h2>
          <p>Ask applicants a few questions before they apply.</p>
          <div id="screeningList" class="post-screening-list"></div>
          <button id="addScreening" class="post-add-question" type="button"><span aria-hidden="true">+</span> Add a question</button>
        </section>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="post-step-footer">
          <a class="post-back" href="./job-description.html"><span aria-hidden="true">←</span> Back</a>
          <button class="post-continue" type="submit">Confirm <span aria-hidden="true">→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./employer-auth.js"></script>
    <script src="./platform-client.js"></script>
    <script src="./script.js"></script>
    <script src="./account-role.js"></script>
    <script src="./employer-nav.js"></script>
  </body>
</html>
