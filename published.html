<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Role published — Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="success-page">
      <div class="success-mark">✓</div>
      <p class="overline">ROLE PUBLISHED</p>
      <h1>Your role is live.</h1>
      <p>Candidates can now view the role and apply. Applications will appear in your hiring inbox.</p>
      <div class="success-actions">
        <a class="next-btn" href="./applicants.html">View applicants <span>→</span></a>
        <a class="secondary-link" href="./index.html">Post another role</a>
      </div>
      <div class="published-preview">
        <span>LIVE ROLE</span>
        <h2 data-review="title">Executive Assistant</h2>
        <p data-review="commitment">Full-time (40 hours per week)</p>
        <small data-review="rate">$3 – $5 / hour</small>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
