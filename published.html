<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Job Published | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./post-steps.css" />
  </head>
  <body class="simple-employer-page employer-only">
    <header class="simple-header">
      <a class="simple-brand site-logo-link" href="./index.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a href="./talent.html">Talent</a><a href="./applicants.html">Hiring inbox</a><a href="./applicants.html?view=messages">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>
    <main class="post-step-shell">
      <nav class="post-step-progress" aria-label="Job posting progress">
        <span class="done"><b>✓</b> Job basics</span><i></i>
        <span class="done"><b>✓</b> Pay</span><i></i>
        <span class="done"><b>✓</b> Description</span><i></i>
        <span class="done"><b>✓</b> Review</span><i></i>
        <span class="done"><b>✓</b> Promote</span>
      </nav>

      <section id="publishedStep" class="post-step-card post-published">
        <div class="post-published-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <h1>Your job is live</h1>
        <p class="post-step-intro">Candidates can now see your job and apply. New applications will show up in your hiring inbox.</p>

        <dl class="post-review-list">
          <div><dt>Job title</dt><dd data-published-field="title"></dd></div>
          <div><dt>Employment type</dt><dd data-published-field="employmentType"></dd></div>
          <div><dt>Hiring timeline</dt><dd data-published-field="hiringTimeline"></dd></div>
          <div><dt>Pay</dt><dd data-published-field="pay"></dd></div>
          <div><dt>Promotion</dt><dd data-published-field="promotion"></dd></div>
          <div><dt>Screening questions</dt><dd data-published-field="questions"></dd></div>
        </dl>

        <footer class="post-step-footer">
          <button id="postAnotherJob" class="post-back" type="button"><span aria-hidden="true">+</span> Post another job</button>
          <a class="post-continue" href="./applicants.html">View applicants <span aria-hidden="true">→</span></a>
        </footer>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./employer-auth.js"></script>
    <script src="./platform-client.js"></script>
    <script src="./script.js"></script>
    <script src="./account-role.js"></script>
  </body>
</html>
