<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employer sign in — Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./candidate-portal.css" />
    <link rel="stylesheet" href="./employer-login.css" />
    <link rel="stylesheet" href="./reset-password.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./google-sign-in.css" />
  </head>
  <body class="portal-auth-page">
    <header class="portal-header">
      <a class="site-logo-link" href="./home.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a href="./candidate-login.html">Candidate sign in</a></nav>
    </header>
    <main class="portal-auth-shell employer-auth-shell">
      <section class="portal-auth-card employer-auth-card">
        <p class="portal-kicker">HIRER WORKSPACE</p>
        <h1>Find your next hire.</h1>
        <p>Sign in to search talent, post jobs and manage applicants.</p>

        <p id="employerAccountNotice" class="portal-result error" aria-live="polite" hidden></p>

        <form id="employerLoginForm">
          <button class="google-sign-in" type="button" data-google-sign-in="employer" data-google-signup="false" data-result="employerLoginResult"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-1.99 3.02v2.51h3.22c1.88-1.74 2.99-4.3 2.99-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.41l-3.22-2.51c-.9.6-2.04.97-3.39.97-2.6 0-4.8-1.76-5.59-4.13H3.09v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.92a6 6 0 0 1 0-3.84V7.49H3.09a10 10 0 0 0 0 9.02l3.32-2.59Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.83 1.51l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.91 5.49l3.32 2.59C7.2 7.71 9.4 5.95 12 5.95Z"/></svg><span>Continue with Google</span></button>
          <div class="google-separator"><span>or use email</span></div>
          <label>Email address or username<input id="employerLoginEmail" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required /></label>
          <label>Password<input id="employerLoginPassword" type="password" autocomplete="current-password" minlength="8" required /></label>
          <p class="portal-forgot"><a href="./reset-password.html?account=employer">Forgot password?</a></p>
          <p id="employerLoginResult" class="portal-result" aria-live="polite" hidden></p>
          <button id="employerLoginButton" type="submit">Sign in <span>→</span></button>
        </form>

        <p class="portal-switch">New to Hire From SA? <a href="./employer-signup.html">Start for Free</a>. Looking for work? <a href="./candidate-login.html">VA Login</a>.</p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./employer-login.js"></script>
    <script type="module" src="./google-sign-in.mjs"></script>
  </body>
</html>
