<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hiring Inbox | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./match-placeholders.css" />
    <link rel="stylesheet" href="./inbox-redesign.css" />
  </head>
  <body class="simple-employer-page inbox-page">
    <header class="simple-header">
      <a class="simple-brand" href="./index.html">HIRE FROM <span>SA</span></a>
      <nav><a class="active" href="./applicants.html">Hiring inbox</a><button id="headerMessages" class="header-nav-button" type="button">Messages</button><a href="./index.html">Post a job</a></nav>
    </header>
    <main class="inbox-shell">
      <section class="inbox-heading">
        <div><p class="simple-kicker">HIRING INBOX</p><h1>Applicants</h1></div>
        <div class="job-filter"><span>Active job</span><div id="jobCombobox" class="job-combobox"><button id="jobDropdownButton" class="job-dropdown-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="jobDropdown"><span id="selectedJobLabel">All active jobs</span><span aria-hidden="true">⌄</span></button><div id="jobDropdown" class="job-dropdown" hidden><input id="jobFilter" type="search" placeholder="Search active jobs" aria-label="Search active jobs" autocomplete="off" /><div id="jobOptions" class="job-options" role="listbox" aria-label="Active jobs"><button class="selected" type="button" role="option" aria-selected="true" data-job="all">All active jobs</button><button type="button" role="option" aria-selected="false" data-job="current">Your newest role</button><button type="button" role="option" aria-selected="false" data-job="operations">Operations Executive Assistant</button><button type="button" role="option" aria-selected="false" data-job="customer">Customer Success Assistant</button></div><p id="jobSearchEmpty" hidden>No active jobs found.</p></div></div></div>
      </section>
      <nav class="simple-pipeline" aria-label="Applicant status">
        <button class="selected" type="button" data-status="all">All <b id="allCandidateCount">4</b></button>
        <button type="button" data-status="new">New <b id="newCandidateCount">2</b></button>
        <button type="button" data-status="shortlisted">Shortlisted <b id="shortlistedCandidateCount">1</b></button>
        <button type="button" data-status="interviewing">Interviewing <b id="interviewingCandidateCount">1</b></button>
      </nav>
      <div class="queue-toolbar"><span id="applicantResultSummary">4 applicants</span><div class="sort-controls"><label class="sort-control"><span>Organize by</span><select id="applicantSort"><option value="match">Best match</option><option value="experience">Relevant experience</option><option value="question">Screening question</option></select></label><label id="questionSortControl" class="sort-control question-sort-control" hidden><span>Question</span><select id="questionSort"></select></label></div></div>

      <section id="candidateList" class="simple-candidate-list" aria-label="Candidates">
        <button class="simple-candidate" data-job="current" data-status="new" data-name="Lerato Mokoena" data-role="Executive Assistant" data-experience="5 years experience" data-match="86" data-summary="Five years supporting senior leaders across complex calendars, travel, and daily priority management." data-photo="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80" data-answer1="I managed a CEO calendar across three time zones, including board meetings, investor calls, and protected focus blocks." data-answer2="I keep one priority list, confirm deadlines in writing, and send a concise daily briefing with decisions and risks." data-answer3="I noticed recurring travel changes were wasting time, so I built a preferred-flight and hotel system that reduced rebooking."><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" /><span class="candidate-identity"><b>Lerato Mokoena</b><small class="candidate-role">Executive Assistant · 5 years</small></span><span class="candidate-overview">Five years supporting senior leaders across complex calendars, travel, and daily priority management.</span><strong class="match-badge">86% match</strong><span class="candidate-arrow" aria-hidden="true">→</span></button>
        <button class="simple-candidate" data-job="current" data-status="new" data-name="Ayanda Khumalo" data-role="Executive Assistant" data-experience="7 years experience" data-match="78" data-summary="Seven years supporting founders and boards across multiple countries with strong executive coordination experience." data-photo="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80" data-answer1="My most complex calendar supported two founders and a quarterly board cadence while the company operated across four countries." data-answer2="I translate priorities into weekly outcomes, flag conflicts early, and close every meeting with an owner and due date." data-answer3="I created an approval tracker after spotting delays in supplier payments, giving leadership one clear view of every blocker."><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" /><span class="candidate-identity"><b>Ayanda Khumalo</b><small class="candidate-role">Executive Assistant · 7 years</small></span><span class="candidate-overview">Seven years supporting founders and boards across multiple countries with strong executive coordination experience.</span><strong class="match-badge">78% match</strong><span class="candidate-arrow" aria-hidden="true">→</span></button>
        <button class="simple-candidate" data-job="operations" data-status="shortlisted" data-name="Zinhle Ndlovu" data-role="Operations Executive Assistant" data-experience="4 years experience" data-match="73" data-summary="Four years coordinating an operations leader, cross-department reporting, and process documentation." data-photo="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80" data-answer1="I coordinated an operations director's schedule, weekly reporting, and meetings with six department leads." data-answer2="I use a single action register and follow up before deadlines instead of waiting until work becomes urgent." data-answer3="I documented our onboarding process when I saw new hires receiving inconsistent information."><img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" /><span class="candidate-identity"><b>Zinhle Ndlovu</b><small>Operations Executive Assistant · 4 years</small></span><span class="candidate-overview">Four years coordinating an operations leader, cross-department reporting, and process documentation.</span><strong class="match-badge">73% match</strong><span class="candidate-arrow" aria-hidden="true">→</span></button>
        <button class="simple-candidate" data-job="customer" data-status="interviewing" data-name="Thandi Jacobs" data-role="Customer Success Assistant" data-experience="6 years experience" data-match="69" data-summary="Six years supporting customer leadership across enterprise renewals, escalations, and follow-ups." data-photo="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80" data-answer1="I supported a customer leader responsible for 40 enterprise accounts and maintained the renewal and escalation calendar." data-answer2="I prepare a Monday risk summary and keep every customer commitment tied to an owner and follow-up date." data-answer3="I introduced a pre-meeting brief that helped the team enter customer calls with the right history and next steps."><img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" /><span class="candidate-identity"><b>Thandi Jacobs</b><small>Customer Success Assistant · 6 years</small></span><span class="candidate-overview">Six years supporting customer leadership across enterprise renewals, escalations, and follow-ups.</span><strong class="match-badge">69% match</strong><span class="candidate-arrow" aria-hidden="true">→</span></button>
        <p id="candidateEmpty" class="candidate-empty" hidden>No applicants in this stage.</p>
      </section>
    </main>
    <aside id="profilePanel" class="profile-panel" hidden aria-label="Applicant profile">
      <div class="profile-panel-backdrop" data-close-profile></div>
      <section class="profile-panel-dialog" role="dialog" aria-modal="true" aria-labelledby="profileName">
        <button class="profile-close" type="button" data-close-profile aria-label="Close applicant profile">×</button>
        <header class="candidate-profile-head"><img id="profilePhoto" src="" alt="" /><div><p class="simple-kicker">APPLICANT PROFILE</p><h2 id="profileName"></h2><p id="profileRole"></p><span id="profileExperience"></span></div><strong id="profileMatch" class="profile-match"></strong></header>
        <section class="profile-overview"><p class="simple-kicker">MATCH OVERVIEW</p><p id="profileSummary"></p></section>
        <section class="answers-section"><p class="simple-kicker">SCREENING QUESTIONS</p><article class="answer-card"><b id="profileQuestion1">Question 1</b><p id="profileAnswer1"></p></article><article class="answer-card"><b id="profileQuestion2">Question 2</b><p id="profileAnswer2"></p></article><article class="answer-card"><b id="profileQuestion3">Question 3</b><p id="profileAnswer3"></p></article></section>
        <footer class="candidate-actions"><button id="rejectCandidate" class="text-button" type="button">Not a fit</button><button id="messageCandidate" class="secondary-button" type="button">Message</button><button id="shortlist" class="primary-button" type="button">Shortlist candidate</button><button id="inviteInterview" class="primary-button" type="button" hidden>Invite to interview</button></footer>
      </section>
    </aside>
    <aside id="messagePanel" class="message-panel" hidden aria-label="Candidate messages">
      <div class="message-panel-backdrop" data-close-messages></div>
      <section class="message-panel-dialog" role="dialog" aria-modal="true" aria-labelledby="messagePanelTitle">
        <header class="message-panel-header">
          <div><p class="simple-kicker">MESSAGES</p><h2 id="messagePanelTitle">Candidate conversation</h2><span id="messagePanelRole"></span></div>
          <button type="button" data-close-messages aria-label="Close messages">×</button>
        </header>
        <div id="messageThread" class="message-thread" aria-live="polite"><p class="message-empty">Loading conversation…</p></div>
        <form id="messageForm" class="message-composer">
          <label for="messageBody">Message</label>
          <textarea id="messageBody" maxlength="2000" rows="4" placeholder="Write a message…" required></textarea>
          <div><span id="messageStatus" aria-live="polite"></span><button class="primary-button" type="submit">Send message <span>→</span></button></div>
        </form>
      </section>
    </aside>
    <div class="toast" id="toast"></div>
    <script src="./script.js"></script>
  </body>
</html>
