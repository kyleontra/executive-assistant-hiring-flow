<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Describe the Job | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./post-steps.css" />
  </head>
  <body class="simple-employer-page employer-only">
    <header class="simple-header">
      <a class="simple-brand site-logo-link" href="./index.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a href="./talent.html">Talent</a><a href="./applicants.html">Hiring inbox</a><a href="./applicants.html?view=messages">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>

    <main class="post-step-shell">
      <nav class="post-step-progress" aria-label="Job posting progress">
        <span class="done"><b>✓</b> Job basics</span><i></i>
        <span class="done"><b>✓</b> Pay</span><i></i>
        <span class="active"><b>3</b> Description</span><i></i>
        <span><b>4</b> Review</span><i></i>
        <span><b>5</b> Promote</span>
      </nav>

      <form id="postJobForm" class="post-step-card" data-step="description" novalidate>
        <h1><label for="description">Job description</label></h1>
        <div class="post-editor">
          <div class="post-editor-toolbar" role="toolbar" aria-label="Formatting">
            <button type="button" data-format="bold" aria-label="Bold"><b>B</b></button>
            <button type="button" data-format="italic" aria-label="Italic"><i>I</i></button>
            <button type="button" data-format="bullet" aria-label="Bulleted list"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="5" r="1.4"/><circle cx="4" cy="10" r="1.4"/><circle cx="4" cy="15" r="1.4"/><path d="M8 5h9M8 10h9M8 15h9"/></svg></button>
          </div>
          <textarea id="description" name="description" maxlength="10000" rows="14" placeholder="Describe the role, the day-to-day responsibilities, and what success looks like." required></textarea>
        </div>
        <p class="post-char-count"><span id="descriptionCount">0</span> / 10,000 characters</p>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="post-step-footer">
          <a class="post-back" href="./compensation.html"><span aria-hidden="true">←</span> Back</a>
          <button class="post-continue" type="submit">Continue <span aria-hidden="true">→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./employer-auth.js"></script>
    <script src="./script.js"></script>
    <script src="./account-role.js"></script>
  </body>
</html>
