<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Job Description | Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
  </head>
  <body class="simple-employer-page">
    <header class="simple-header">
      <a class="simple-brand" href="./index.html">HIRE FROM <span>SA</span></a>
      <nav><a href="./applicants.html">Hiring inbox</a><a href="./scheduler-settings.html">Interview scheduler</a><a href="./jobs.html">View jobs</a></nav>
    </header>

    <main class="job-flow-shell description-step-shell">
      <nav class="flow-progress five-step-progress" aria-label="Job posting progress">
        <span class="done"><b>✓</b> Title</span><i></i>
        <span class="active"><b>2</b> Description</span><i></i>
        <span><b>3</b> Questions</span><i></i>
        <span><b>4</b> Pay</span><i></i>
        <span><b>5</b> Review</span>
      </nav>

      <form id="postJobForm" class="job-flow-card" data-step="description" novalidate>
        <header class="flow-card-heading">
          <p class="simple-kicker">POST A JOB</p>
          <h1>Job description <em>*</em></h1>
        </header>

        <label class="simple-field description-field standalone-description"><span class="visually-hidden">Job description</span>
          <span class="description-editor-toolbar" aria-label="Job description formatting tools">
            <span class="format-tools">
              <button type="button" data-format="bold" aria-label="Bold selected text"><b>B</b></button>
              <button type="button" data-format="italic" aria-label="Italicize selected text"><i>I</i></button>
              <button type="button" data-format="bullet" aria-label="Create a bulleted list">• List</button>
              <button type="button" data-format="number" aria-label="Create a numbered list">1. List</button>
            </span>
          </span>
          <textarea id="description" name="description" maxlength="10000" rows="10" placeholder="Enter job description" required></textarea>
          <small><span id="descriptionCount">0</span> / 10,000 characters</small>
        </label>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="flow-card-footer">
          <a href="./index.html">← Back</a>
          <button class="primary-button" type="submit">Continue <span>→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="./script.js"></script>
  </body>
</html>
