<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d6be8" />
    <title>Reset your password — Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./candidate-portal.css" />
    <link rel="stylesheet" href="./reset-password.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./candidate-flow-layout.css" />
  </head>
  <body class="portal-auth-page onboarding-page">
    <header class="portal-header">
      <a class="site-logo-link" href="./home.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav><a id="backToSignIn" href="./candidate-login.html">Back to sign in</a></nav>
    </header>
    <main class="portal-auth-shell">
      <section class="portal-auth-card reset-card">
        <p class="portal-kicker">PASSWORD RECOVERY</p>
        <h1>Reset your password.</h1>
        <p>Enter your account email and we’ll send you a secure six-digit code.</p>

        <form id="requestResetForm" novalidate>
          <label>Email address<input id="resetEmail" type="email" autocomplete="email" maxlength="254" required /></label>
          <p id="requestResetResult" class="portal-result" aria-live="polite" hidden></p>
          <button id="requestResetButton" type="submit">Send reset code <span>→</span></button>
        </form>

        <form id="completeResetForm" novalidate hidden>
          <p class="reset-code-note">Enter the code sent to <strong id="resetEmailSummary"></strong>. Check Junk or Spam if it is not in your inbox.</p>
          <label>Six-digit reset code<input id="resetCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required /></label>
          <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
          <label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
          <p id="completeResetResult" class="portal-result" aria-live="polite" hidden></p>
          <button id="completeResetButton" type="submit">Reset password <span>→</span></button>
          <button id="resendResetCode" class="reset-secondary" type="button">Send a new code</button>
          <button id="changeResetEmail" class="reset-link-button" type="button">Use a different email</button>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./reset-password.js"></script>
  </body>
</html>
