<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Role Details | Hire From SA</title>
    <meta http-equiv="refresh" content="0;url=./job-description.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./employer-simple.css" />
    <link rel="stylesheet" href="./post-flow.css" />
  </head>
  <body class="simple-employer-page">
    <script>window.location.replace('./job-description.html');</script>
    <header class="simple-header">
      <a class="simple-brand" href="./index.html">HIRE FROM <span>SA</span></a>
      <nav><a href="./applicants.html">Hiring inbox</a><a href="./applicants.html?view=messages">Messages</a><a href="./posted-jobs.html">Posted jobs</a></nav>
    </header>

    <main class="job-flow-shell questions-step-shell">
      <nav class="flow-progress five-step-progress" aria-label="Job posting progress">
        <span class="done"><b>✓</b> Title</span><i></i>
        <span class="done"><b>✓</b> Description</span><i></i>
        <span class="active"><b>3</b> Questions</span><i></i>
        <span><b>4</b> Pay</span><i></i>
        <span><b>5</b> Review</span>
      </nav>

      <form id="postJobForm" class="job-flow-card" data-step="questions" novalidate>
        <header class="flow-card-heading">
          <p class="simple-kicker">POST A JOB</p>
          <h1>Applicant questions</h1>
        </header>

        <section class="question-builder standalone-questions">
          <div class="question-builder-heading">
            <div><p>At least 1 question required</p></div>
          </div>
          <div id="jobQuestionList" class="job-question-list"></div>
          <div class="question-builder-actions">
            <button id="addQuestion" class="add-question-button" type="button"><span>+</span> Add question</button>
          </div>
        </section>

        <div id="postFormResult" class="simple-form-result" aria-live="polite"></div>
        <footer class="flow-card-footer">
          <a href="./job-description.html">← Back</a>
          <button class="primary-button" type="submit">Continue <span>→</span></button>
        </footer>
      </form>
    </main>
    <div class="toast" id="toast"></div>
    <script src="./script.js"></script>
  </body>
</html>
