<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VA dashboard — Hire From SA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./candidate-portal.css" />
    <link rel="stylesheet" href="./candidate-resume-dashboard.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./onboarding-videos.css" />
    <link rel="stylesheet" href="./candidate-flow-layout.css" />
    <link rel="stylesheet" href="./candidate-dashboard.css" />
    <link rel="stylesheet" href="./va-jobs.css" />
    <link rel="stylesheet" href="./va-messages.css" />
    <link rel="stylesheet" href="./va-applications.css" />
    <link rel="stylesheet" href="./va-account.css" />
    <link rel="stylesheet" href="./va-profile.css" />
    <link rel="stylesheet" href="./account-menu.css" data-sava-account-styles />
  </head>
  <body class="va-dashboard-page">
    <header class="portal-header va-dashboard-header">
      <a class="site-logo-link" href="./home.html"><img class="site-logo" src="./assets/hire-from-sa-logo.jpeg" alt="Hire From SA" /></a>
      <nav class="va-header-nav" aria-label="VA dashboard navigation">
        <div class="va-tabs" role="tablist" aria-label="VA dashboard">
          <button id="tab-jobs" class="va-primary-tab" type="button" role="tab" data-dashboard-tab="jobs" aria-controls="panel-jobs" aria-selected="false" tabindex="-1">Apply for Jobs</button>
          <button id="tab-messages" type="button" role="tab" data-dashboard-tab="messages" aria-controls="panel-messages" aria-selected="false" tabindex="-1">Messages <span id="messageCount" class="va-count">0</span></button>
          <button id="tab-applications" type="button" role="tab" data-dashboard-tab="applications" aria-controls="panel-applications" aria-selected="true">Applications <span id="applicationCount" class="va-count">0</span></button>
        </div>
      </nav>
    </header>
    <main class="portal-shell">
      <p id="portalStatus" class="portal-status" role="status" aria-live="polite">Loading your dashboard…</p>
      <button id="dashboardRetry" class="va-button" type="button" hidden>Try again</button>
      <section id="candidateGate" class="applications-gate" hidden>
        <h1>Before you apply, finish up next steps.</h1>
        <a href="./candidate-onboarding.html">Finish up next steps <span>→</span></a>
      </section>
      <section id="candidateReady" hidden>
        <section id="panel-messages" class="vm-panel" role="tabpanel" aria-labelledby="tab-messages" tabindex="0" hidden>
          <div class="vm-top"><h1>Messages</h1>
            <label><span>Organize by</span><select id="messageSort" aria-label="Organize by"><option value="recent">Most recent</option><option value="unread">Unread first</option></select></label>
          </div>
          <p id="inboxStatus" class="vm-status" role="status" aria-live="polite" hidden></p>
          <div id="candidateMessages"></div>
        </section>
        <section id="panel-applications" class="va-apps-panel" role="tabpanel" aria-labelledby="tab-applications" tabindex="0">
          <div class="va-apps-top"><h1>Applications</h1>
            <div class="va-apps-filters">
              <label><span>Status</span><select id="applicationStatus" aria-label="Status"><option value="">All</option><option value="pending">Pending</option><option value="hired">Hired</option><option value="rejected">Not selected</option></select></label>
              <label><span>Organize by</span><select id="applicationSort" aria-label="Organize by"><option value="newest">Newest</option><option value="oldest">Oldest</option></select></label>
            </div>
          </div>
          <div id="candidateApplications" class="va-apps-list"></div>
        </section>
        <section id="panel-profile" class="vp-panel" role="tabpanel" aria-label="My Profile" tabindex="0" hidden><p id="profilePhotoStatus" class="vp-status" role="status" aria-live="polite" hidden></p><div id="candidateProfile"></div></section>
        <section id="panel-payments" class="va-acct-panel va-pay-panel" role="tabpanel" aria-label="Payments" tabindex="0" hidden><div id="candidatePayments"></div></section>
        </section>
        <section id="panel-jobs" class="vj-panel" role="tabpanel" aria-labelledby="tab-jobs" tabindex="0" hidden>
          <div class="vj-top"><h1>Apply for jobs</h1><p id="jobsStatus" role="status" aria-live="polite"></p></div>
          <div class="vj-toolbar">
            <label class="vj-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="jobSearch" type="search" placeholder="Search jobs or skills" aria-label="Search jobs" /></label>
            <label>Job type<select id="jobType"><option value="">All job types</option></select></label>
            <label>Organize by<select id="jobSort"><option value="newest">Newest</option><option value="pay">Highest pay</option></select></label>
          </div>
          <div id="jobBrowser" class="vj-browser">
            <div id="candidateJobs" class="vj-list" aria-label="Open jobs"></div>
            <aside id="candidateJobDetail" class="vj-detail" aria-live="polite"></aside>
          </div>
          <button id="jobsRetry" class="va-button" type="button" hidden>Reload jobs</button>
        </section>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-client.js"></script>
    <script src="./platform-client.js"></script>
    <script type="module" src="./candidate-dashboard.js"></script>
  </body>
</html>
